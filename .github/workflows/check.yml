name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scoop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install from this bucket and run
        shell: pwsh
        run: |
          Invoke-RestMethod get.scoop.sh -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add conn3x $PWD
          scoop install conn3x/conn3x
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conn3x version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  # Temporary: checks the first winget submission, then goes.
  winget:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate and install the winget manifest
        shell: pwsh
        run: |
          $m = "winget\manifests\c\Conn3x\Conn3x\0.19.0"
          winget --version
          winget validate --manifest $m
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          winget settings --enable LocalManifestFiles
          winget install --manifest $m --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$env:LOCALAPPDATA\Microsoft\WinGet\Links;$env:PATH"
          conn3x version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
